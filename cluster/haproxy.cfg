global
    log stdout format raw local0
    maxconn 4096
    stats socket /tmp/haproxy-admin.sock mode 600 level admin
    hard-stop-after 16m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  16m
    timeout server  16m
    timeout tunnel  1h
    timeout http-request 30s
    timeout http-keep-alive 10s
    timeout check 6s
    retries 0

frontend http_front
    bind *:3000
    option forwardfor
    capture request header X-Forwarded-For len 128
    default_backend abu_backend

backend abu_backend
    balance leastconn
    option httpchk GET /ready
    http-check expect status 200

    # Stable DNS aliases from Compose service names / replica slots.
    server master abu-api-master:3000 check inter 3s rise 2 fall 3 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server slave1 abu-api-slave-1:3000 check inter 3s rise 2 fall 3 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server slave2 abu-api-slave-2:3000 check inter 3s rise 2 fall 3 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 10s
